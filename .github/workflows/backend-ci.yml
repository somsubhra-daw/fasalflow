name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend Tests & PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fasalflow_test
          POSTGRES_USER: fasalflow
          POSTGRES_PASSWORD: fasalflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasalflow -d fasalflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://fasalflow:fasalflow_test_password@localhost:5432/fasalflow_test
      TEST_DATABASE_URL: postgresql+psycopg://fasalflow:fasalflow_test_password@localhost:5432/fasalflow_test
      JWT_SECRET: fasalflow_super_secret_jwt_key_for_dev_change_in_production
      INTERNAL_API_KEY: fasalflow_internal_secret_key_change_in_production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations on PostgreSQL
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Seed Database on PostgreSQL
        run: |
          python -m app.db.seed

      - name: Run Pytest Suite (Unit, API, Models, and PostgreSQL Integration)
        run: |
          pytest backend/tests/ -v --durations=10
