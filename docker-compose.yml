services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fasalflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fasalflow
      POSTGRES_USER: fasalflow
      POSTGRES_PASSWORD: fasalflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fasalflow-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://fasalflow:fasalflow_dev@postgres:5432/fasalflow
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
